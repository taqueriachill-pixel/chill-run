name: APKを作る

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: 計算部分のテスト
        run: gradle --no-daemon testDebugUnitTest

      - name: 鍵がまだ登録されていないとき（ビルドが通るかだけ確かめる）
        if: env.KEYSTORE_BASE64 == ''
        run: |
          # 本番と同じ作り方で最後まで通るかを、その場かぎりの仮の鍵で確かめる（この APK は配らない）
          keytool -genkeypair -keystore "$RUNNER_TEMP/temp.keystore" -storetype PKCS12 -alias chillrun \
            -keyalg RSA -keysize 2048 -validity 1 -storepass temporary -keypass temporary -dname "CN=temp"
          KEYSTORE_FILE="$RUNNER_TEMP/temp.keystore" SIGNING_PASSWORD=temporary gradle --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
          echo "::warning::署名の鍵（SIGNING_KEYSTORE_BASE64 / SIGNING_PASSWORD）が未登録のため、Releases には置きませんでした。docs/SETUP.md の手順で登録してください。"

      - name: 固定の鍵で署名した APK を作る
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "chill-run-0.7.${GITHUB_RUN_NUMBER}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Releases に置く
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.7.${GITHUB_RUN_NUMBER}" "chill-run-0.7.${GITHUB_RUN_NUMBER}.apk" \
            --target "$GITHUB_SHA" \
            --title "Chill Run 0.7.${GITHUB_RUN_NUMBER}" \
            --notes "ブランチ: ${GITHUB_REF_NAME} / 進み具合は docs/PROGRESS.md を参照。下の .apk をスマホでダウンロードしてインストールしてください。"
